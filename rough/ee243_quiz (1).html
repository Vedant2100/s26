hcal{N}(\\hat{x},P)$ — strictly unimodal. PF: particle clusters at two or more locations simultaneously — naturally represents multi-modal uncertainty."},{"q":"Measurement weighting $w_t^{(i)}\\propto p(z_t|x_t^{(i)})$ computes:","opts":["A. Prior probability of particle state","B. Likelihood: how probable is observation $z_t$ given particle's hypothesized state $x_t^{(i)}$","C. Transition probability from $x_{t-1}$ to $x_t^{(i)}$","D. The posterior probability (Bayes-inverted)"],"ans":1,"exp":"$w^{(i)}\\propto p(z_t|x_t^{(i)})$: particles consistent with the measurement get high weight; inconsistent ones near-zero weight."},{"q":"Required particle count scales with state dimensionality as:","opts":["A. $O(d)$ linear","B. $O(d^2)$ quadratic","C. Exponential in $d$ (curse of dimensionality)","D. Constant — independent of $d$"],"ans":2,"exp":"State space volume grows as $e^d$. Fixed $N$ particles cover exponentially smaller fraction per added dimension. Practical limit: $d\\lesssim15$-$20$."},{"q":"EKF handles nonlinear $f,h$ by:","opts":["A. Using more particles for better coverage","B. Linearizing $f$ and $h$ via first-order Taylor (Jacobians) at current estimate, then applying standard KF","C. Maintaining a GMM instead of single Gaussian","D. Not requiring a prior distribution"],"ans":1,"exp":"EKF: $F=\\partial f/\\partial x|_{\\hat{x}}$, $H_J=\\partial h/\\partial x|_{\\hat{x}}$. Use $F,H_J$ in place of $A,H$ in KF equations. Approximation error grows with nonlinearity."},{"q":"Mean-shift tracking maintains the object as a color histogram and finds new position by:","opts":["A. Template matching via NCC","B. Gradient ascent on Bhattacharyya coefficient $\\rho(y)=\\sum_m\\sqrt{\\hat{p}_m(y)\\cdot q_m}$ — equivalent to mean-shift iterations","C. RANSAC on matched features","D. Optical flow from the object centroid"],"ans":1,"exp":"Comaniciu 2003: maximize $\\rho(y)=\\sum_m\\sqrt{p_m(y)q_m}$ (candidate vs model histogram) via mean-shift gradient ascent. Efficient; handles gradual appearance change."},{"q":"UKF handles nonlinearity by:","opts":["A. Random particles like a PF","B. Propagating a deterministic set of $2d+1$ sigma points through $f$ and $h$ — capturing mean and covariance to 2nd order without linearization","C. GMM approximation of posterior","D. Only using measurement model"],"ans":1,"exp":"UKF: select $2d+1$ sigma points; propagate through $f$: $y_k=f(x_k)$; compute new mean and covariance from $\\{y_k\\}$. No linearization — captures true nonlinear transformation to 2nd order."},{"q":"CONDENSATION was designed for tracking contours in clutter because:","opts":["A. Fewer particles than generic PF","B. Cluttered environments create multi-modal posteriors; single-estimate trackers fail under occlusion; CONDENSATION maintains the full distribution","C. Contour shapes modeled as Gaussian","D. CONDENSATION forces contour onto image gradient"],"ans":1,"exp":"Multiple equally plausible contours may exist in clutter. CONDENSATION maintains particle hypotheses for all — the correct one survives with highest weight when clutter resolves."},{"q":"Kalman filter for constant-velocity tracking: state $x=[p,v]^T$, motion matrix $A$ for $\\Delta t$:","opts":["A. $A=\\begin{bmatrix}1&0\\\\0&1\\end{bmatrix}$","B. $A=\\begin{bmatrix}1&\\Delta t\\\\0&1\\end{bmatrix}$","C. $A=\\begin{bmatrix}\\Delta t&0\\\\0&\\Delta t\\end{bmatrix}$","D. $A=\\begin{bmatrix}0&1\\\\1&0\\end{bmatrix}$"],"ans":1,"exp":"$p_{t+1}=p_t+v_t\\Delta t$, $v_{t+1}=v_t$. Matrix form: $[p;v]_{t+1}=\\begin{bmatrix}1&\\Delta t\\\\0&1\\end{bmatrix}[p;v]_t$."},{"q":"Particle impoverishment (sample poverty) is addressed by:","opts":["A. Dramatically increasing $N$","B. Roughening: adding small random perturbation after resampling, or MCMC moves to diversify particles","C. Decreasing $\\tau$ in the measurement model","D. Keeping low-weight particles after resampling"],"ans":1,"exp":"Repeated resampling duplicates high-weight particles $\\Rightarrow$ diversity collapses. Roughening: add $\\mathcal{N}(0,h^2I)$ after resampling. MCMC: Metropolis-Hastings steps for diversity."},{"q":"SIR particle filter step order:","opts":["A. Resample $\\to$ Weight $\\to$ Propagate","B. Weight $\\to$ Propagate $\\to$ Resample","C. Propagate $\\to$ Weight $\\to$ Resample (if $N_\\text{eff}<N_\\text{thresh}$)","D. Resample $\\to$ Propagate $\\to$ Weight"],"ans":2,"exp":"SIR: (1) Propagate: $x_t^{(i)}\\sim p(x_t|x_{t-1}^{(i)})$. (2) Weight: $w_t^{(i)}\\propto p(z_t|x_t^{(i)})$. (3) Resample if $N_\\text{eff}<N/2$. Weights reflect current observation before resampling."},{"q":"Kalman gain $K\\to0$ means the filter:","opts":["A. Fully trusts the new measurement","B. Ignores the measurement — prediction dominates because $R\\gg HP_{t|t-1}H^T$","C. State estimate is diverging","D. Has converged to the true state permanently"],"ans":1,"exp":"$K\\to0$ when $R\\to\\infty$: measurements too noisy. Update $\\hat{x}_{t|t}=\\hat{x}_{t|t-1}+K_t(\\cdot)\\to\\hat{x}_{t|t-1}$ — prediction dominates."},{"q":"Bootstrap particle filter uses $p(x_t|x_{t-1})$ as proposal. The optimal alternative is:","opts":["A. $p(z_t|x_t)$ — the likelihood","B. $p(x_t|x_{t-1},z_t)\\propto p(z_t|x_t)p(x_t|x_{t-1})$ — the optimal proposal incorporating current measurement","C. Uniform distribution over state space","D. Posterior from previous step"],"ans":1,"exp":"Optimal proposal minimizes weight variance. Bootstrap (prior) is tractable but inefficient when likelihood is narrow compared to prior — particles waste computation in low-likelihood regions."},{"q":"After resampling in a particle filter, the weights should be set to:","opts":["A. Their previous values","B. $1/N$ — uniform weights, since resampling already incorporated the previous weights","C. Zero for low-weight particles, one for others","D. Proportional to their previous weights squared"],"ans":1,"exp":"Resampling draws $N$ particles from the weighted distribution, effectively incorporating the weights. The new particles represent equally-likely hypotheses, so weights reset to $1/N$."}]},{"name":"Camera Models & Projective Geometry","desc":"Pinhole model, intrinsics, homogeneous coordinates, calibration","qs":[{"q":"Pinhole projection of 3D camera-frame point $(X,Y,Z)$ to image $(x,y)$:","opts":["A. $x=X/f,\\;y=Y/f$","B. $x=fX/Z,\\;y=fY/Z$","C. $x=fX,\\;y=fY$","D. $x=X+c_x,\\;y=Y+c_y$"],"ans":1,"exp":"Central perspective: $x=f\\cdot X/Z,\\;y=f\\cdot Y/Z$. Division by $Z$ produces perspective foreshortening — objects at greater depth appear proportionally smaller."},{"q":"Camera intrinsic matrix $K=\\begin{bmatrix}f_x&s&c_x\\\\0&f_y&c_y\\\\0&0&1\\end{bmatrix}$. Skew $s\\neq0$ indicates:","opts":["A. Different pixel sizes in $x$ and $y$","B. Pixel axes are not orthogonal — sensor rows and columns not perpendicular","C. Radial distortion present","D. Principal point is offset"],"ans":1,"exp":"Skew $s=f_x\\cot\\phi$ where $\\phi$ is the inter-axis angle. $s=0$ for modern digital sensors (perpendicular axes — manufactured to tight tolerances)."},{"q":"Full projection matrix $P=K[R|t]$ (with $s=0$) has how many DOF?","opts":["A. 9","B. 10","C. 11","D. 12"],"ans":1,"exp":"$K$ with $s=0$: $f_x,f_y,c_x,c_y=4$ DOF. $R\\in\\text{SO}(3)$: 3 DOF. $t\\in\\mathbb{R}^3$: 3 DOF. Total: $4+3+3=10$ DOF."},{"q":"Converting homogeneous $(w_1,w_2,w_3)$ to Cartesian:","opts":["A. Drop the third component: $(w_1,w_2)$","B. Divide by third component: $(w_1/w_3,\\;w_2/w_3)$","C. Multiply by third component","D. Normalize to unit length"],"ans":1,"exp":"$(w_1,w_2,w_3)\\equiv\\lambda(w_1,w_2,w_3)$ for any $\\lambda\\neq0$. Cartesian: $(w_1/w_3,\\;w_2/w_3)$ — the perspective division. Points at infinity have $w_3=0$."},{"q":"Barrel distortion ($k_1<0$) causes:","opts":["A. Image corners brighter","B. Straight lines away from center curve inward — image appears to bulge outward at center","C. Pincushion: image pinches inward","D. Loss of border resolution"],"ans":1,"exp":"Radial distortion: $x_d=x(1+k_1r^2+\\cdots)$. $k_1<0$: outer regions pulled in $\\Rightarrow$ center bulges (barrel). $k_1>0$: pincushion."},{"q":"Zhang's checkerboard calibration method requires:","opts":["A. A calibrated ruler at known 3D position","B. A planar pattern viewed in $\\geq3$ different orientations","C. A 3D calibration rig with known 3D points","D. Multiple cameras observing the same scene"],"ans":1,"exp":"Zhang (2000): each view gives a homography $H_i$ between board and image. Constraints from $\\{H_i\\}$ give $K$ in closed form, then refined by nonlinear optimization. Only a flat pattern needed."},{"q":"The principal point $(c_x,c_y)$:","opts":["A. Always the geometric image center $(W/2,H/2)$","B. Image coordinates where the optical axis intersects the image plane — may differ from image center","C. Vanishing point for vertical lines","D. Camera center coordinates in world space"],"ans":1,"exp":"The optical axis pierces the image plane at the principal point. In practice $(c_x,c_y)\\approx(W/2,H/2)$ but may deviate due to lens misalignment. Calibration determines it precisely."},{"q":"Vanishing point of 3D direction $\\mathbf{d}$:","opts":["A. $V=K\\mathbf{d}$","B. $V=K[R|t]\\cdot(\\mathbf{d},0)^T$ — treating direction as point at infinity","C. $V=K^{-1}\\mathbf{d}$","D. $V=R^TK\\mathbf{d}$"],"ans":1,"exp":"A 3D direction is a point at infinity: $(\\mathbf{d},0)^T$ in homogeneous 3D. Projecting through $P=K[R|t]$: $KR\\mathbf{d}$ (translation drops out). Vanishing point $V=KR\\mathbf{d}$."},{"q":"DLT for estimating $P$ (11 DOF) requires minimum how many 3D-2D correspondences?","opts":["A. 4","B. 6","C. 8","D. 11"],"ans":1,"exp":"Each 3D-2D correspondence: 2 linear equations. $\\lceil11/2\\rceil=6$ correspondences minimum. Stack into $12\\times9$ system; SVD null space gives $P$."},{"q":"Back-projecting image point $(u,v)$ to 3D gives:","opts":["A. A unique 3D point at depth $Z=f$","B. A ray: $\\{C+\\lambda K^{-1}(u,v,1)^T:\\lambda>0\\}$ — all 3D points projecting to $(u,v)$","C. The camera optical center","D. A circle at distance $f$"],"ans":1,"exp":"Without depth: we only know the direction $K^{-1}(u,v,1)^T$. All 3D points at different depths along this ray project to the same image point $(u,v)$."},{"q":"Without homogeneous coordinates, perspective projection is nonlinear because:","opts":["A. Division by $Z$ cannot be expressed as a matrix multiplication","B. Perspective requires spherical trigonometry","C. The image plane is curved","D. Focal length introduces a quadratic term"],"ans":0,"exp":"$x=fX/Z$: division by $Z$ is nonlinear. In homogeneous coordinates: $Kx_h=P\\cdot X_h$ is linear. The nonlinearity is deferred to the final $w$-division — key insight enabling projective geometry via linear algebra."},{"q":"Increasing focal length $f$ (fixed sensor size) causes:","opts":["A. Wider field of view","B. Narrower FOV (telephoto), objects appear magnified, shallower depth of field","C. Same FOV, higher resolution","D. Wider FOV, larger circle of confusion"],"ans":1,"exp":"$\\text{FOV}=2\\arctan(W_\\text{sensor}/2f)$: $f\\uparrow\\Rightarrow\\text{FOV}\\downarrow$. Objects appear magnified. Larger circle of confusion for off-focus points $\\Rightarrow$ shallower depth of field."},{"q":"The circle of confusion (CoC):","opts":["A. Circular image of a point at the focal distance","B. Blurred disk formed by a point NOT at focal distance; DOF = range where CoC $\\leq$ one pixel","C. Chromatic aberration ring","D. Fisheye lens distortion pattern"],"ans":1,"exp":"Off-focus point $\\Rightarrow$ cone of rays misses image plane $\\Rightarrow$ disk (CoC). DOF: range of depths where $|\\text{CoC}|\\leq$ pixel size. Larger aperture $D\\Rightarrow$ larger CoC $\\Rightarrow$ shallower DOF."},{"q":"Extrinsic parameters $[R|t]$ encode:","opts":["A. Pixel to camera coordinate mapping","B. Rigid body transform (rotation $R$ + translation $t$) from world to camera coordinates","C. Lens distortion model","D. Mapping from image to 3D world points"],"ans":1,"exp":"$X_\\text{cam}=RX_\\text{world}+t$. $R$: camera's orientation relative to world. $t$: translation. Together: defines 'where the camera is looking.'"},{"q":"Weak perspective projection is valid when:","opts":["A. Camera has short focal length","B. Object depth variation $\\delta Z\\ll$ mean depth $Z_0$ AND object subtends small visual angle","C. Scene viewed from far away only","D. B conditions individually (not necessarily together)"],"ans":1,"exp":"Weak perspective: $x\\approx(f/Z_0)X$ (constant magnification). Valid when $|\\delta Z|\\ll Z_0$ (depth variation small relative to mean) AND object is small/distant."},{"q":"Parallel lines in the ground plane share a vanishing line called:","opts":["A. The epipolar line","B. The horizon line (image of the ground plane at infinity)","C. The principal line","D. The optical axis projection"],"ans":1,"exp":"All horizontal direction vanishing points lie on the horizon line — the image of the plane at infinity restricted to horizontal directions."},{"q":"Skew $s\\approx0$ for modern digital cameras because:","opts":["A. Short focal lengths","B. Manufacturing precision ensures pixel rows and columns are perpendicular ($\\phi=90°\\Rightarrow s=f_x\\cot90°=0$)","C. Barrel distortion corrects skew","D. Calibration software always sets $s=0$"],"ans":1,"exp":"$s=f_x\\cot\\phi$ where $\\phi$ is the inter-axis angle. Modern silicon sensors manufactured to $\\phi=90°\\pm0.001°$, giving $s\\approx0$."},{"q":"Relative rotation $R_\\text{rel}$ and translation $t_\\text{rel}$ from cam 1 to cam 2 (extrinsics $R_1,t_1$ and $R_2,t_2$):","opts":["A. $R_\\text{rel}=R_2R_1,\\;t_\\text{rel}=t_2-t_1$","B. $R_\\text{rel}=R_2R_1^T,\\;t_\\text{rel}=t_2-R_2R_1^Tt_1$","C. $R_\\text{rel}=R_1^TR_2,\\;t_\\text{rel}=t_2-t_1$","D. $R_\\text{rel}=R_2-R_1$"],"ans":1,"exp":"$X_2=R_2X_w+t_2=R_2R_1^TX_1+(t_2-R_2R_1^Tt_1)$. So $R_\\text{rel}=R_2R_1^T$, $t_\\text{rel}=t_2-R_\\text{rel}t_1$."},{"q":"Perspective foreshortening: at twice the depth, a fixed-size object appears:","opts":["A. Half the size","B. One quarter the size","C. The same size","D. $1/\\sqrt{2}$ the size"],"ans":0,"exp":"$x=fX/Z$: if $Z\\to2Z$, then $x\\to x/2$. Image size inversely proportional to depth — the fundamental law of perspective projection."},{"q":"A 2D homography has how many DOF?","opts":["A. 6","B. 7","C. 8","D. 9"],"ans":2,"exp":"$H$ is $3\\times3$, homogeneous (scale-free): $9-1=8$ DOF. 4 point correspondences give $4\\times2=8$ equations — exactly determined."}]},{"name":"Stereo Vision & Structure from Motion","desc":"Epipolar geometry, essential/fundamental matrix, 8-point algorithm, SfM","qs":[{"q":"Epipolar constraint: given point $p$ in image 1, its correspondence in image 2 lies:","opts":["A. At a unique point given by scene depth","B. On the epipolar line $l_2=Fp$ — reducing 2D search to 1D","C. At the mirror image about the image center","D. In a $w\\times w$ window around $p$"],"ans":1,"exp":"Given $p$, all 3D points consistent with it form a ray. That ray projects to a line in image 2 — the epipolar line. Search along $l_2$ instead of the entire image."},{"q":"Essential matrix $E=[t]_\\times R$ satisfies $\\tilde{q}^TE\\tilde{p}=0$. Derived from:","opts":["A. Homogeneous coordinate multiplication","B. Coplanarity of $\\tilde{p},R\\tilde{q}$, and baseline $t$: $\\tilde{q}^T(t\\times R\\tilde{p})=\\tilde{q}^T[t]_\\times R\\tilde{p}=0$","C. Triangle inequality in camera geometry","D. The Fundamental Theorem of Algebra"],"ans":1,"exp":"Scalar triple product $=0$: $\\tilde{p},R\\tilde{q},t$ lie in the epipolar plane $\\Rightarrow(R\\tilde{p})\\cdot(t\\times R\\tilde{q})=0\\Rightarrow\\tilde{q}^T[t]_\\times R\\tilde{p}=0$."},{"q":"Fundamental matrix $F$ vs. essential matrix $E$:","opts":["A. $F$ for pixel coordinates (includes $K_1,K_2$); $E$ for calibrated coordinates — $F=K_2^{-T}EK_1^{-1}$","B. $F$ has rank 2; $E$ has rank 3","C. $F$ is symmetric; $E$ is skew-symmetric","D. $F$ uses 5 correspondences; $E$ uses 8"],"ans":0,"exp":"$F=K_2^{-T}EK_1^{-1}$: incorporates calibration, works with pixel coordinates $x'^TFx=0$. $E=[t]_\\times R$ works in normalized calibrated coordinates. Both have rank 2."},{"q":"The 8-point algorithm for $F$: the '8' refers to:","opts":["A. 8 entries (the $(3,3)$ entry fixed to 1)","B. $F$ has 9 entries, scale-free $\\Rightarrow$ 8 DOF; each correspondence gives 1 linear equation $\\Rightarrow$ 8 needed","C. 8 DOF from rank-2 constraint + scale","D. 8 points needed for numerical stability only"],"ans":1,"exp":"$F$: 9 entries, homogeneous $\\Rightarrow$ 8 DOF. Rank-2 constraint NOT used in the linear step (enforced post-hoc by SVD). 8 correspondences $\\Rightarrow$ unique null space solution."},{"q":"The epipole $e_1$ in image 1:","opts":["A. Projection of camera 2's optical center into image 1","B. Intersection of all epipolar lines in image 1","C. Both A and B — equivalent definitions","D. The principal point of camera 1"],"ans":2,"exp":"$e_1=P_1C_2$ (projection of cam 2's center into image 1). All epipolar lines in image 1 pass through $e_1$. Both definitions are equivalent."},{"q":"In rectified stereo with focal length $f$ and baseline $B$, disparity $d=x_L-x_R$ and depth $Z$:","opts":["A. $Z=d\\cdot f/B$","B. $Z=f\\cdot B/d$","C. $Z=f/(d\\cdot B)$","D. $Z=B\\cdot d/f$"],"ans":1,"exp":"$Z=fB/d$. Disparity $d\\propto1/Z$ — closer objects have larger disparity. Uncertainty: $\\delta Z=-fB/d^2\\cdot\\delta d$ grows quadratically with $Z$."},{"q":"Recovering $R,t$ from $E$ via SVD: number of candidate $(R,t)$ pairs:","opts":["A. 1 unique solution","B. 2","C. 4","D. 8"],"ans":2,"exp":"$E=U\\Sigma V^T$: two choices of $R$ ($UWV^T$ or $UW^TV^T$) $\\times$ two signs of $t$ ($\\pm Ue_3$) $=4$ combinations. Only 1 places triangulated points in front of both cameras."},{"q":"Bundle adjustment minimizes:","opts":["A. 3D point positions only","B. Camera pose parameters only","C. $\\sum_{i,j}\\|x_{ij}-\\pi(P_j,X_i)\\|^2$ — total reprojection error over all cameras and 3D points jointly","D. Feature descriptor distances"],"ans":2,"exp":"BA: $\\min_{\\{P_j\\},\\{X_i\\}}\\sum_{(i,j)}\\|x_{ij}-\\pi(P_j,X_i)\\|^2$. Jointly optimizes camera poses and 3D structure. Solved by Levenberg-Marquardt with sparse block structure."},{"q":"Hartley's normalized 8-point algorithm improves stability by:","opts":["A. Using integer coordinates $[0,255]$","B. Normalizing correspondences to zero mean and RMS distance $\\sqrt{2}$ from origin before solving","C. Independently normalizing $x$ and $y$ to unit variance","D. Subtracting the image center only"],"ans":1,"exp":"Hartley (1997): translate centroid to origin, scale so mean distance from origin $=\\sqrt{2}$. Isotropic normalization dramatically improves numerical accuracy."},{"q":"A degenerate configuration for $E/F$ estimation:","opts":["A. Many textured edges in the scene","B. All 3D points coplanar, or cameras share the same optical center ($t=0$)","C. More than 8 correspondences used","D. Low image resolution"],"ans":1,"exp":"Degenerate: (1) Coplanar points: system under-determined. (2) $t=0$ (pure rotation): $E=[t]_\\times R=0$ — undefined."},{"q":"Rank-2 constraint on $F$ enforced post-hoc by:","opts":["A. Dividing $F$ by its trace","B. $\\hat{F}=U\\,\\text{diag}(\\sigma_1,\\sigma_2,0)\\,V^T$ — setting smallest singular value to zero","C. Removing the last row of $F$","D. Normalizing $F$ to unit Frobenius norm"],"ans":1,"exp":"SVD of $F$: $U\\text{diag}(\\sigma_1,\\sigma_2,\\sigma_3)V^T$. Set $\\sigma_3=0$: $\\hat{F}=U\\text{diag}(\\sigma_1,\\sigma_2,0)V^T$. Eckart-Young theorem: closest rank-2 matrix to $F$."},{"q":"Triangulation from two camera rays (noisy data):","opts":["A. Exact intersection — rays always intersect in noiseless data","B. Point minimizing sum of squared distances to both rays (linear DLT or reprojection error), since noisy rays are skew","C. Midpoint of the common perpendicular","D. Projecting onto both image planes and averaging"],"ans":1,"exp":"Noisy correspondences $\\Rightarrow$ back-projected rays are skew. Linear DLT: set up $AX=0$, solve via SVD. Optimal: minimize $\\sum_j\\|x_j-\\pi(P_j,X)\\|^2$."},{"q":"PnP (Perspective-n-Point) solves for:","opts":["A. Camera intrinsic matrix $K$","B. Camera extrinsics $[R|t]$ given known 3D points and their 2D projections","C. 3D positions of observed points","D. Fundamental matrix between two views"],"ans":1,"exp":"PnP input: $n$ 3D world points, 2D observations, known $K$. Output: camera pose $[R|t]$. Used in incremental SfM to register new images."},{"q":"SIFT features are used in SfM because they are invariant to:","opts":["A. Viewpoint changes $>45°$","B. Scale, in-plane rotation, and moderate illumination changes — enabling matching across wide baseline collections","C. Motion blur and compression only","D. Color changes but not scale"],"ans":1,"exp":"SIFT: DoG keypoints (scale invariance), canonical orientation (rotation invariance), 128-D histogram descriptor (partial illumination invariance). Robust enough for wide-baseline SfM datasets."},{"q":"Incremental SfM (COLMAP) builds the reconstruction by:","opts":["A. Processing all images simultaneously","B. Starting with a well-matched image pair; then adding images one-by-one via PnP with periodic bundle adjustment","C. Clustering images and reconstructing clusters independently","D. Using GPS/IMU priors for every pose"],"ans":1,"exp":"Incremental SfM: (1) Select initial pair. (2) Estimate $E$, triangulate. (3) Register new images via PnP. (4) Triangulate new tracks. (5) Bundle adjust to prevent drift. Repeat 3-5."},{"q":"DOF of the essential matrix $E$:","opts":["A. 6 (3 for $R$ + 3 for $t$)","B. 5 (3 for $R$ + 2 for direction of $t$ — scale of $t$ is unrecoverable)","C. 4","D. 7"],"ans":1,"exp":"$E=[t]_\\times R$: scaling $t$ by $\\lambda$ scales $E$ by $\\lambda$ (scale-free). So $t$ contributes only 2 DOF (direction on unit sphere). $R$: 3 DOF. Total: 5 DOF."},{"q":"Multi-view stereo (MVS) improves over two-view stereo by:","opts":["A. Using a larger baseline between exactly 2 cameras","B. Aggregating photoconsistency from many overlapping views — stronger constraint, better coverage, occlusion handling","C. Running SfM on video frames only","D. Using semantic segmentation to guide stereo"],"ans":1,"exp":"MVS uses 10-1000+ images with known poses. Photometric consistency tested across all visible views — much stronger constraint than two views. Occluded views handled by using remaining visible ones."},{"q":"Stereo rectification transforms both images so that:","opts":["A. Both images have the same size","B. Epipolar lines become horizontal scanlines at the same $y$-coordinate — enabling efficient 1D correspondence search","C. Lens distortion is removed before matching","D. Principal points are aligned"],"ans":1,"exp":"Rectification warps both images so all epipolar lines are horizontal. Correspondence search: only horizontal scan per row. Enables DP and semi-global matching algorithms."},{"q":"Reprojection error in SfM:","opts":["A. 3D distance between reconstructed and true point positions","B. $\\|x_{ij}-\\pi(P_j,X_i)\\|$ — 2D distance between observed feature and projected 3D point in image $j$","C. Descriptor distance between matched feature pairs","D. Rotation angle error between estimated and true cameras"],"ans":1,"exp":"Reprojection error: $\\sum_{(i,j)}\\|x_{ij}-\\pi(P_j,X_i)\\|^2$. Minimizing this (bundle adjustment) jointly optimizes cameras and 3D points."},{"q":"Planar homography $H$ is estimated from:","opts":["A. Essential matrix plus known depth","B. $\\geq4$ point correspondences on the planar surface","C. Fundamental matrix plus known baseline","D. 3 correspondences plus one distance measurement"],"ans":1,"exp":"$H$ (8 DOF) requires $4$ correspondences: $4\\times2=8$ linear equations. DLT or RANSAC+DLT for robustness."}]},{"name":"Generative Models","desc":"VAE, GAN, diffusion models, ELBO, classifier-free guidance","qs":[{"q":"VAE ELBO: $\\mathcal{L}=\\mathbb{E}_{q(z|x)}[\\log p(x|z)]-D_\\text{KL}(q(z|x)\\|p(z))$. The KL term:","opts":["A. Maximizes reconstruction quality","B. Regularizes encoder: penalizes $q(z|x)$ for deviating from prior $p(z)=\\mathcal{N}(0,I)$ — smooths latent space for sampling","C. Computes log-likelihood of data directly","D. Ensures decoder is invertible"],"ans":1,"exp":"Without KL: encoder memorizes each $x$ as a delta function — no latent structure, random $\\mathcal{N}(0,I)$ samples produce garbage. KL forces approximate posterior toward $\\mathcal{N}(0,I)$."},{"q":"The reparameterization trick $z=\\mu+\\sigma\\cdot\\varepsilon$, $\\varepsilon\\sim\\mathcal{N}(0,I)$, enables:","opts":["A. Closed-form KL divergence computation","B. Backpropagation through sampling: $\\partial z/\\partial\\mu=1$, $\\partial z/\\partial\\sigma=\\varepsilon$ — gradient flows through the deterministic function","C. Deterministic latent codes","D. Sampling from bounded distributions"],"ans":1,"exp":"$z\\sim\\mathcal{N}(\\mu,\\sigma^2)$ is non-differentiable. Reparameterize: $z=\\mu+\\sigma\\varepsilon$ (fix $\\varepsilon$, differentiate through $\\mu,\\sigma$). $\\frac{\\partial\\mathcal{L}}{\\partial\\mu}$ and $\\frac{\\partial\\mathcal{L}}{\\partial\\sigma}$ flow through this deterministic path."},{"q":"A regular autoencoder without KL regularization cannot generate effectively because:","opts":["A. The bottleneck is too small","B. The latent space has no enforced structure — encoder maps to disconnected, non-smooth regions; random $\\mathcal{N}(0,I)$ samples likely fall in uncovered regions","C. Autoencoders cannot reconstruct accurately","D. Sampling requires gradient computation"],"ans":1,"exp":"Without regularization: training points map to isolated clusters. Points between clusters (drawn from $\\mathcal{N}(0,I)$) have no training signal — decoder outputs meaningless images."},{"q":"GAN minimax: $\\min_G\\max_D\\mathbb{E}_x[\\log D(x)]+\\mathbb{E}_z[\\log(1-D(G(z)))]$. Generator gradient vanishes early because:","opts":["A. $G$ has too many parameters","B. When $D(G(z))\\approx0$: $\\log(1-D(G(z)))\\approx0$ with near-zero gradient; fix: maximize $\\mathbb{E}[\\log D(G(z))]$ (non-saturating loss)","C. Latent code $z$ has wrong dimension","D. GAN gradients always zero at Nash equilibrium"],"ans":1,"exp":"Early in training $D(G(z))\\approx0\\Rightarrow\\log(1-D(G(z)))$ saturates. Non-saturating: $G$ maximizes $\\log D(G(z))$ — same equilibrium, large gradient when $D(G(z))$ is small."},{"q":"DDPM forward process: $q(x_t|x_0)$ in closed form with $\\bar{\\alpha}_t=\\prod_{s=1}^t(1-\\beta_s)$:","opts":["A. $x_t=\\sqrt{\\bar{\\alpha}_t}\\,x_0+\\sqrt{1-\\bar{\\alpha}_t}\\,\\varepsilon,\\;\\varepsilon\\sim\\mathcal{N}(0,I)$","B. $x_t=x_0+\\sqrt{t\\beta}\\,\\varepsilon$","C. $x_t=\\beta_t x_{t-1}+(1-\\beta_t)\\varepsilon$","D. $x_t=x_0(1-\\beta)^t$"],"ans":0,"exp":"$q(x_t|x_0)=\\mathcal{N}(\\sqrt{\\bar{\\alpha}_t}x_0,(1-\\bar{\\alpha}_t)I)$. As $t\\to T$: $\\bar{\\alpha}_T\\to0\\Rightarrow x_T\\approx\\mathcal{N}(0,I)$ — all signal destroyed."},{"q":"DDPM (simplified) training objective for $\\varepsilon_\\theta(x_t,t)$:","opts":["A. Predict $x_0$: $\\|x_0-\\hat{x}_\\theta\\|^2$","B. Predict added noise: $\\mathbb{E}_{x_0,\\varepsilon,t}\\|\\varepsilon-\\varepsilon_\\theta(\\sqrt{\\bar{\\alpha}_t}x_0+\\sqrt{1-\\bar{\\alpha}_t}\\varepsilon,\\,t)\\|^2$","C. Minimize $D_\\text{KL}$ at each step independently","D. Maximize $\\log p_\\theta(x_0)$ directly"],"ans":1,"exp":"Ho et al. 2020 simplified objective: predict $\\varepsilon$ added at step $t$. Empirically outperforms predicting $x_0$ directly."},{"q":"DDIM achieves faster sampling than DDPM by:","opts":["A. Using a smaller network","B. Defining a deterministic non-Markovian reverse process — same trained model, $\\sim50$ steps instead of $1000$","C. Training on lower resolution then upsampling","D. Fewer training epochs"],"ans":1,"exp":"DDIM: rewrite reverse process as a deterministic ODE. No stochasticity $\\Rightarrow$ large steps possible. Same $\\varepsilon_\\theta$ as DDPM, no retraining required."},{"q":"Classifier-free guidance (CFG) in conditional diffusion:","opts":["A. Trains a separate classifier and uses $\\nabla_x\\log p_\\phi(c|x)$","B. Jointly trains conditional $\\varepsilon_\\theta(x_t,t,c)$ and unconditional $\\varepsilon_\\theta(x_t,t,\\varnothing)$; at inference: $\\tilde{\\varepsilon}=(1+w)\\varepsilon_c-w\\varepsilon_u$","C. Adds classification loss to diffusion objective","D. Fine-tunes on labeled data after pretraining"],"ans":1,"exp":"CFG: randomly drop $c$ during training to jointly learn unconditional model. At inference: $\\tilde{\\varepsilon}=\\varepsilon_u+w(\\varepsilon_c-\\varepsilon_u)$. Guidance weight $w$: higher $\\Rightarrow$ stronger adherence to $c$."},{"q":"Latent Diffusion Models (Stable Diffusion): key computational benefit:","opts":["A. Simpler noise schedule","B. $512^2$ image $\\to$ $64^2\\times4$ latent: $\\sim50\\times$ fewer elements $\\Rightarrow$ dramatically cheaper diffusion computation","C. No need for a U-Net","D. Fewer sampling steps because latent space is smoother"],"ans":1,"exp":"$512\\times512\\times3=786{,}432$ pixels vs $64\\times64\\times4=16{,}384$ latents. Running $T=1000$ diffusion steps on the latent is $\\sim50\\times$ cheaper. VAE decoder maps latent back to pixels."},{"q":"VAE ELBO reconstruction-KL tension:","opts":["A. Both terms always increase together","B. Maximizing reconstruction requires precise encoding (narrow posterior, high KL); minimizing KL requires diffuse posterior (poor reconstruction)","C. KL term only affects the decoder","D. Reconstruction maximization requires a broad, diffuse posterior"],"ans":1,"exp":"$\\beta$-VAE makes this explicit: $\\mathcal{L}_\\beta=\\mathbb{E}[\\log p(x|z)]-\\beta D_\\text{KL}$. Perfect reconstruction: tight posterior, high KL. Perfect regularization: posterior $=\\mathcal{N}(0,I)$, poor reconstruction."},{"q":"VQ-VAE discrete codebook: non-differentiability of nearest-neighbor lookup handled by:","opts":["A. Gumbel-softmax relaxation only","B. Straight-through estimator: forward uses $z_q=e_{k^*}$; backward copies gradient from decoder input to encoder output as if $z_q=z_e$","C. Codebook not trained — only encoder and decoder","D. Soft attention over all codebook entries"],"ans":1,"exp":"Straight-through (Bengio 2013): in backward pass, $\\partial z_q/\\partial z_e=I$. Encoder gradient is the decoder's gradient evaluated at $z_q$ — passed through quantization as if it were an identity."},{"q":"Score function $s_\\theta(x)$ in score-based generative models approximates:","opts":["A. $\\nabla_x\\log p_\\theta(x|z)$","B. The Stein score $\\nabla_x\\log p_\\text{data}(x)$","C. $\\nabla_\\theta\\log p_\\theta(x)$ (parameter gradient)","D. Optimal transport map from noise to data"],"ans":1,"exp":"Score matching: train $s_\\theta(x)\\approx\\nabla_x\\log p_\\text{data}(x)$. Langevin dynamics: $x_{k+1}=x_k+\\alpha s_\\theta(x_k)+\\sqrt{2\\alpha}\\varepsilon_k\\Rightarrow x\\sim p_\\text{data}$ as $k\\to\\infty$."},{"q":"VDM (Video Diffusion Model) ELBO contains a consistency term:","opts":["A. Temporal motion consistency penalty","B. $\\mathbb{E}[D_\\text{KL}(q(x_t|x_{t-1},x_0)\\|p_\\theta(x_t|x_{t+1}))]$ — ensures learned reverse is consistent with forward process at intermediate $t$","C. Reconstruction loss on keyframes only","D. Temporal smoothing regularizer on latent trajectory"],"ans":1,"exp":"VDM ELBO: reconstruction + prior matching + consistency $\\sum_t\\mathbb{E}[D_\\text{KL}(q(x_t|x_{t-1},x_0)\\|p_\\theta(x_t|x_{t+1}))]$. Ensures forward and reverse transitions agree at every timestep."},{"q":"Mode collapse in GANs: why is it a stable failure mode?","opts":["A. $D$ becomes too strong and blocks $G$","B. $G$ finds a few outputs that fool $D$; $D$ has no gradient to push $G$ toward uncovered modes","C. $G$ collapses to the data mean","D. Occurs only when LR is too high"],"ans":1,"exp":"$G$ specializes in a subset of modes achieving $D(G(z))\\approx1$. $D$ correctly predicts real for those modes — $G$ receives zero gradient for modes it never generates. Wasserstein GAN addresses this."},{"q":"Diffusion models vs GANs: the key trade-off:","opts":["A. Diffusion requires labeled data; GANs don't","B. Diffusion: many sequential denoising steps (slow inference); GANs: single forward pass (fast inference)","C. Diffusion has lower training stability","D. Diffusion cannot be conditioned"],"ans":1,"exp":"High-quality diffusion: $50$-$1000$ U-Net forward passes. GANs: one generator pass. DDIM, consistency models, flow matching actively reduce diffusion's inference cost."},{"q":"Signal-to-noise ratio $\\text{SNR}(t)=\\bar{\\alpha}_t/(1-\\bar{\\alpha}_t)$ as $t\\to T$:","opts":["A. $\\text{SNR}\\to\\infty$ (pure signal)","B. $\\text{SNR}\\to0$ — $\\bar{\\alpha}_T\\to0$, signal fully destroyed","C. $\\text{SNR}\\to1$","D. $\\text{SNR}$ oscillates"],"ans":1,"exp":"$\\bar{\\alpha}_T=\\prod(1-\\beta_t)\\to0$ by design. $\\text{SNR}=\\bar{\\alpha}_T/(1-\\bar{\\alpha}_T)\\to0$. At $T$: $x_T\\sim\\mathcal{N}(0,I)$ — no image information remains."},{"q":"VAE decoder $p_\\theta(x|z)=\\mathcal{N}(x;\\mu_\\theta(z),\\sigma^2I)$ (fixed $\\sigma$): reconstruction loss:","opts":["A. Cross-entropy","B. MSE: $\\|x-\\mu_\\theta(z)\\|^2/(2\\sigma^2)$ — from $-\\log p(x|z)$ for Gaussian likelihood","C. $L_1$ loss","D. Perceptual (VGG) loss"],"ans":1,"exp":"$-\\log\\mathcal{N}(x;\\mu,\\sigma^2I)=\\frac{1}{2\\sigma^2}\\|x-\\mu\\|^2+\\text{const}$. MSE explains why VAEs produce blurry images: MSE equally penalizes all pixels, preferring smooth mean images."},{"q":"$\\beta$-VAE ($\\beta>1$) achieves better disentanglement at the cost of:","opts":["A. Slower training","B. Worse reconstruction quality — stronger KL forces more independent latent dimensions but less precise encoding","C. Smaller latent space","D. Only works for categorical attributes"],"ans":1,"exp":"$\\beta$-VAE: $\\mathcal{L}_\\beta=\\mathbb{E}[\\log p(x|z)]-\\beta D_\\text{KL}$. $\\beta>1$: stronger bottleneck $\\Rightarrow$ more disentangled. Trade-off: blurrier reconstructions."},{"q":"Flow matching (Lipman 2022) vs DDPM: the conceptual difference:","opts":["A. Flow matching uses discrete steps; DDPM is continuous","B. Flow matching defines straight interpolation paths $x_t=(1-t)x_0+t\\varepsilon$ and trains a velocity field to follow them — straighter paths, fewer integration steps needed","C. Diffusion cannot be conditioned; flow matching can","D. Flow matching requires a discriminator"],"ans":1,"exp":"DDPM: curved score-based paths requiring many small steps. Flow matching: linear paths from data $x_0$ to noise $\\varepsilon$. Constant velocity field $\\Rightarrow$ ODE easier to integrate $\\Rightarrow$ fewer NFEs at inference."}]}];

const results={};
let state={screen:'topics',topicIdx:-1,qIdx:0,selected:null,answered:false,scores:[],history:[]};

function rmath(){
  if(typeof renderMathInElement==='undefined')return;
  try{renderMathInElement(document.getElementById('app'),{
    delimiters:[{left:'$',right:'$',display:false},{left:'$$',right:'$$',display:true}],
    throwOnError:false
  });}catch(e){}
}

function render(){
  const app=document.getElementById('app');
  if(state.screen==='topics')renderTopics(app);
  else if(state.screen==='quiz')renderQuiz(app);
  else renderResults(app);
  setTimeout(rmath,60);
}

function renderTopics(app){
  const total=D.reduce((s,t)=>s+t.qs.length,0);
  let h=`<div class="hdr">EE243 Advanced Computer Vision</div><div class="sub">${D.length} topic areas · ${total} mastery questions · KaTeX formula rendering</div><div class="grid">`;
  D.forEach((t,i)=>{
    const done=results[i]!==undefined;
    const pct=done?Math.round(results[i].score/t.qs.length*100):null;
    h+=`<div class="tcard" onclick="startTopic(${i})"><div class="num">Topic ${i+1}</div><div class="tname">${t.name}</div><div class="tdesc">${t.desc}</div>${done?`<div class="done">✓ ${pct}% — ${results[i].score}/${t.qs.length}</div>`:''}</div>`;
  });
  h+='</div>';app.innerHTML=h;
}

function startTopic(idx){
  state={screen:'quiz',topicIdx:idx,qIdx:0,selected:null,answered:false,scores:[],history:[]};render();
}

function renderQuiz(app){
  const topic=D[state.topicIdx];
  const total=topic.qs.length;
  const q=topic.qs[state.qIdx];
  const pct=(state.qIdx/total*100).toFixed(0);
  let opts=q.opts.map((o,i)=>{
    let cls='opt';
    if(state.answered){if(i===q.ans)cls+=' correct';else if(i===state.selected&&i!==q.ans)cls+=' wrong';}
    return `<button class="${cls}" ${state.answered?'disabled':''} onclick="selOpt(${i})">${o}</button>`;
  }).join('');
  let exp='';
  if(state.answered){
    const ok=state.selected===q.ans;
    exp=`<div class="exp ${ok?'correct-exp':'wrong-exp'}"><div class="exp-label">${ok?'✓ Correct':'✗ Incorrect'}</div>${q.exp}</div>`;
  }
  const isLast=state.qIdx===total-1;
  app.innerHTML=`<div class="quiz-wrap">
<div class="quiz-top"><button class="back-btn" onclick="goBack()">← Topics</button><span class="qtopic">${topic.name}</span><span class="qcount">Q${state.qIdx+1}/${total}</span></div>
<div class="pbar-bg"><div class="pbar" style="width:${pct}%"></div></div>
<div class="qcard"><div class="qnum">Question ${state.qIdx+1} of ${total}</div><div class="qtext">${q.q}</div></div>
<div class="opts">${opts}</div>${exp}
${state.answered?`<button class="next-btn" onclick="nextQ()">${isLast?'See Results ✓':'Next Question →'}</button>`:''}
</div>`;
}

function selOpt(i){
  if(state.answered)return;
  state.selected=i;state.answered=true;
  const ok=i===D[state.topicIdx].qs[state.qIdx].ans;
  state.scores.push(ok?1:0);
  state.history.push({q:state.qIdx,sel:i,ok:ok});
  render();
}

function nextQ(){
  const total=D[state.topicIdx].qs.length;
  if(state.qIdx===total-1){
    results[state.topicIdx]={score:state.scores.reduce((a,b)=>a+b,0),history:state.history};
    state.screen='results';render();
  } else {
    state.qIdx++;state.selected=null;state.answered=false;render();
  }
}

function goBack(){state.screen='topics';render();}

function renderResults(app){
  const topic=D[state.topicIdx];
  const res=results[state.topicIdx];
  const total=topic.qs.length;
  const pct=Math.round(res.score/total*100);
  const wrong=res.history.filter(h=>!h.ok).length;
  let grade,gColor;
  if(pct>=90){grade='Mastered';gColor='#166534';}
  else if(pct>=70){grade='Solid';gColor='#854d0e';}
  else if(pct>=50){grade='Learning';gColor='#1d4ed8';}
  else{grade='Needs Review';gColor='#991b1b';}
  let revHtml='<div class="rev-list"><div style="font-size:11px;font-weight:700;color:#aaa;margin-bottom:10px;letter-spacing:1px;text-transform:uppercase">Question Breakdown</div>';
  res.history.forEach((h,i)=>{
    const q=topic.qs[h.q].q.replace(/\$[^$]*\$/g,'[math]').slice(0,75)+'...';
    revHtml+=`<div class="rev-item"><div class="dot ${h.ok?'dot-ok':'dot-no'}"></div><span>Q${i+1}: ${q}</span></div>`;
  });
  revHtml+='</div>';
  app.innerHTML=`<div class="quiz-wrap">
<div class="quiz-top"><button class="back-btn" onclick="goBack()">← Topics</button><span class="qtopic">${topic.name} — Results</span></div>
<div class="score-card">
<div class="score-big">${pct}%</div>
<div class="score-label" style="color:${gColor}">${grade}</div>
<div class="score-grid">
<div class="smet"><div class="sv" style="color:#16a34a">${res.score}</div><div class="sk">Correct</div></div>
<div class="smet"><div class="sv" style="color:#dc2626">${wrong}</div><div class="sk">Wrong</div></div>
<div class="smet"><div class="sv">${total}</div><div class="sk">Total</div></div>
</div>
<div class="row-btns">
<button class="outline-btn" onclick="retryTopic()">Retry Topic</button>
<button class="next-btn" onclick="goBack()">Choose Topic ↗</button>
</div>
${revHtml}
</div></div>`;
}

function retryTopic(){const idx=state.topicIdx;delete results[idx];startTopic(idx);}

render();

</script>

</html>
